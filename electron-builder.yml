appId: com.gustavo.tibidle
productName: TibIdle
copyright: Copyright © 2026 Gustavo

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

asar: true

mac:
  category: public.app-category.games
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

win:
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
